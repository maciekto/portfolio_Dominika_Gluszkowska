# Serwer statyczny portfolio (Next.js, statyczny eksport).
# Każda podstrona to gotowy plik HTML: /pl → pl.html, /pl/campaign → pl/campaign.html.
# Działa w obrazie nginx-unprivileged: proces bez roota, port 8080 w kontenerze.

# Prawdziwe IP odwiedzających w logach. cloudflared łączy się z hosta,
# więc do kontenera ruch przychodzi z bramy sieci Dockera (172.16.0.0/12).
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;

# Język dla adresów bez prefiksu (/ i np. /campaign) – z nagłówka Accept-Language przeglądarki.
map $http_accept_language $preferred_lang {
    default en;
    ~*^pl   pl;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;
    # Przekierowania ze ścieżką względną – za Cloudflare nie zgubią https ani domeny.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/otf font/woff2 application/manifest+json;

    # Dla healthchecka Dockera.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Strona główna bez języka → /pl albo /en.
    location = / {
        return 302 /$preferred_lang;
    }

    # Stare adresy bez języka (np. /campaign) → wersja językowa.
    # Nazwana grupa, bo regex w map ($preferred_lang) nadpisuje zwykłe $1.
    location ~ ^/(?<section>campaign|ecommerce|branding|ai|next)/?$ {
        return 302 /$preferred_lang/$section;
    }

    # Pliki Next z hashem w nazwie (JS, CSS, fonty, zdjęcia) – cache na rok.
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Filmy (public/videos/) – duże pliki bez hasha w nazwie, cache na tydzień.
    location /videos/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Podstrony: /pl/ai → /pl/ai.html. Ukośnik na końcu → bez ukośnika.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri.html @fallback;
    }

    # Nieistniejący adres → strona główna w języku przeglądarki (jak wcześniej w wersji SPA).
    location @fallback {
        return 302 /$preferred_lang;
    }
}
