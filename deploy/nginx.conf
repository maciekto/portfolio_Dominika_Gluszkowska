# Serwer statyczny portfolio (SPA z React Routerem).
# Działa w obrazie nginx-unprivileged: proces bez roota, port 8080 w kontenerze.

# Prawdziwe IP odwiedzających w logach. cloudflared łączy się z hosta,
# więc do kontenera ruch przychodzi z bramy sieci Dockera (172.16.0.0/12).
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/otf;

    # Dla healthchecka Dockera.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Pliki z hashem w nazwie (JS, CSS, zdjęcia, font, film) – cache na rok.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Wszystko inne – istniejący plik albo index.html (trasy /en/…, /pl/… obsługuje React Router).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
